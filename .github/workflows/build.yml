name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Works whether the files are at repo root OR still inside kd-mobile-project.zip
      - name: Find project folder
        run: |
          if [ -f buildozer.spec ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f kd-mobile/buildozer.spec ]; then
            echo "PROJECT_DIR=kd-mobile" >> "$GITHUB_ENV"
          else
            unzip -o kd-mobile-project.zip
            echo "PROJECT_DIR=kd-mobile" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython<3"

      # Fixes: 'sdkmanager ... does not exist, sdkmanager is not installed'
      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: buildozer -v android debug

      - uses: actions/upload-artifact@v4
        with:
          name: kd-mobile-apk
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
