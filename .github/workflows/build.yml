name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Find project folder
        run: |
          SPEC=$(find . -path ./.git -prune -o -name buildozer.spec -print | head -1)
          if [ -z "$SPEC" ]; then
            for z in $(find . -path ./.git -prune -o -iname "*.zip" -print); do
              unzip -o -q "$z" -d "$(dirname "$z")/_unzipped" || true
            done
            SPEC=$(find . -path ./.git -prune -o -name buildozer.spec -print | head -1)
          fi
          if [ -z "$SPEC" ]; then
            echo "ERROR: buildozer.spec not found"
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$SPEC")" >> "$GITHUB_ENV"

      - name: Force safe build settings
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          sed -i '/^android\.ndk *=/d;/^android\.archs *=/d;/^android\.ndk_api *=/d' buildozer.spec
          sed -i '/^\[app\]/a android.ndk = 25b\nandroid.ndk_api = 24\nandroid.archs = arm64-v8a' buildozer.spec
          grep -n "android\." buildozer.spec

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer==1.5.0 "cython<3"

      - name: Install Android SDK
        run: |
          SDK="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL -o /tmp/ct.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/ct.zip -d /tmp/ct
          mv /tmp/ct/cmdline-tools "$SDK/cmdline-tools/latest"
          ln -sfn "$SDK/cmdline-tools/latest" "$SDK/tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee /tmp/build.log

      - name: Show error summary
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -n -i -E "error|failed|fatal|exception" /tmp/build.log | tail -n 25
          echo "=== LAST 80 LINES ==="
          tail -n 80 /tmp/build.log

      - uses: actions/upload-artifact@v4
        with:
          name: kd-mobile-apk
          path: ${{ env.PROJECT_DIR }}/bin/*.apk
